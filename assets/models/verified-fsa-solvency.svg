<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">NEXT solvency trend from 2023 to 2025</title>
  <desc id="desc">Verified table showing debt to assets, debt to equity and interest coverage.</desc>
  <rect width="1600" height="850" fill="#f7f8fa"/>
  <rect width="1600" height="118" fill="#173958"/>
  <text x="70" y="72" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">NEXT solvency trend</text>
  <text x="70" y="164" fill="#40505a" font-family="Arial, sans-serif" font-size="24">Historical balance-sheet and coverage measures</text>

  <rect x="70" y="220" width="1460" height="76" rx="8" fill="#dfe8f1"/>
  <g fill="#10202a" font-family="Arial, sans-serif" font-size="27" font-weight="700">
    <text x="100" y="268">Metric</text><text x="760" y="268" text-anchor="end">2023</text><text x="1090" y="268" text-anchor="end">2024</text><text x="1430" y="268" text-anchor="end">2025</text>
  </g>
  <g fill="#10202a" font-family="Arial, sans-serif" font-size="30">
    <rect x="70" y="310" width="1460" height="112" rx="6" fill="#ffffff" stroke="#d6d9d7"/>
    <text x="100" y="380">Debt to assets</text><text x="760" y="380" text-anchor="end">48.10%</text><text x="1090" y="380" text-anchor="end">40.57%</text><text x="1430" y="380" text-anchor="end" fill="#236a51" font-weight="700">33.22%</text>
    <rect x="70" y="438" width="1460" height="112" rx="6" fill="#ffffff" stroke="#d6d9d7"/>
    <text x="100" y="508">Debt to equity</text><text x="760" y="508" text-anchor="end">1.64x</text><text x="1090" y="508" text-anchor="end">1.17x</text><text x="1430" y="508" text-anchor="end" fill="#236a51" font-weight="700">0.92x</text>
    <rect x="70" y="566" width="1460" height="112" rx="6" fill="#ffffff" stroke="#d6d9d7"/>
    <text x="100" y="636">Interest coverage</text><text x="760" y="636" text-anchor="end">12.38x</text><text x="1090" y="636" text-anchor="end">12.19x</text><text x="1430" y="636" text-anchor="end">11.39x</text>
  </g>
  <rect x="70" y="724" width="1460" height="72" rx="8" fill="#dfecea"/>
  <text x="100" y="771" fill="#236a51" font-family="Arial, sans-serif" font-size="26" font-weight="700">Leverage declined through 2025; interest coverage remained above 11x.</text>
</svg>
