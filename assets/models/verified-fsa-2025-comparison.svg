<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NEXT and JD Sports 2025 ratio comparison</title>
  <desc id="desc">Verified comparison of net profit margin, asset turnover, equity multiplier and return on equity.</desc>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1600" height="118" fill="#173958"/>
  <text x="70" y="72" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">2025 operating and return comparison</text>
  <text x="70" y="164" fill="#40505a" font-family="Arial, sans-serif" font-size="24">NEXT plc and JD Sports Fashion plc · DuPont ratios</text>

  <rect x="70" y="220" width="1460" height="76" rx="8" fill="#dfe8f1"/>
  <text x="100" y="268" fill="#10202a" font-family="Arial, sans-serif" font-size="27" font-weight="700">Metric</text>
  <text x="710" y="268" fill="#10202a" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="end">NEXT</text>
  <text x="1010" y="268" fill="#10202a" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="end">JD Sports</text>
  <text x="1500" y="268" fill="#10202a" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="end">Read-through</text>

  <g font-family="Arial, sans-serif" font-size="28" fill="#10202a">
    <rect x="70" y="310" width="1460" height="102" rx="6" fill="#ffffff" stroke="#d6d9d7"/>
    <text x="100" y="373">Net profit margin</text><text x="710" y="373" text-anchor="end">12.03%</text><text x="1010" y="373" text-anchor="end">4.28%</text><text x="1500" y="373" text-anchor="end" fill="#236a51">NEXT leads</text>
    <rect x="70" y="426" width="1460" height="102" rx="6" fill="#ffffff" stroke="#d6d9d7"/>
    <text x="100" y="489">Asset turnover</text><text x="710" y="489" text-anchor="end">1.26x</text><text x="1010" y="489" text-anchor="end">1.15x</text><text x="1500" y="489" text-anchor="end" fill="#236a51">NEXT slightly higher</text>
    <rect x="70" y="542" width="1460" height="102" rx="6" fill="#ffffff" stroke="#d6d9d7"/>
    <text x="100" y="605">Equity multiplier</text><text x="710" y="605" text-anchor="end">2.78x</text><text x="1010" y="605" text-anchor="end">2.95x</text><text x="1500" y="605" text-anchor="end">JD Sports uses more leverage</text>
    <rect x="70" y="658" width="1460" height="102" rx="6" fill="#ffffff" stroke="#d6d9d7"/>
    <text x="100" y="721">Return on equity</text><text x="710" y="721" text-anchor="end" font-weight="700">41.96%</text><text x="1010" y="721" text-anchor="end" font-weight="700">14.53%</text><text x="1500" y="721" text-anchor="end" fill="#236a51">NEXT leads</text>
  </g>
  <text x="70" y="835" fill="#5f6c74" font-family="Arial, sans-serif" font-size="22">Verified from the supplied workbook · Ratios rounded to two decimal places</text>
</svg>
